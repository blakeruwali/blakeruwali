<style>
  /* Dark tech system (2026-11): same layout and sections as the October site, restyled. */
  :root {
    --bg: #080A0E; --band: #0E131A; --card: #141A22; --line: #1F2833; --line2: #2A3542;
    --text: #FFFFFF; --soft: #BEC8D2; --muted: #828C96;
    --cyan: #00E5FF; --cyan-soft: rgba(0, 229, 255, .14); --cyan-glow: rgba(0, 229, 255, .45);
    --font: "Avenir Next", Avenir, Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 17px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: var(--cyan); }
  a:hover { color: var(--text); }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
  img { display: block; max-width: 100%; height: auto; }
  p { margin: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 480px) { .wrap { padding-left: 16px; padding-right: 16px; } }

  /* Type: heavy white caps for headlines, cyan for labels */
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; color: var(--cyan); text-transform: uppercase; }
  .serif, h2 { font-family: var(--font); font-weight: 800; text-transform: uppercase; letter-spacing: -.3px; color: var(--text); }
  .pill { display: inline-block; align-self: flex-start; background: var(--cyan); color: var(--bg); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; font-size: 15px; line-height: 1; padding: 9px 13px 8px; border-radius: 9px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; background: var(--cyan); color: var(--bg); text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; font-size: 15px; padding: 0 24px; border-radius: 10px; transition: transform 250ms var(--ease), box-shadow 250ms; }
  .btn:hover { color: var(--bg); transform: translateY(-2px); box-shadow: 0 12px 32px -12px var(--cyan-glow); }
  .btn-ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px var(--cyan); }
  .btn-ghost:hover { color: var(--text); background: var(--cyan-soft); box-shadow: inset 0 0 0 2px var(--cyan), 0 12px 32px -14px var(--cyan-glow); }
  .skip { position: absolute; top: 16px; inset-inline-start: 16px; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .skip:focus { width: auto; height: auto; clip-path: none; background: var(--cyan); color: var(--bg); padding: 10px 16px; z-index: 10; }

  /* Header */
  .top { display: flex; gap: 20px; align-items: center; justify-content: space-between; padding-top: 24px; padding-bottom: 24px; }
  .brand { font-family: var(--font); font-weight: 900; text-transform: uppercase; letter-spacing: .4px; font-size: 22px; color: var(--text); text-decoration: none; white-space: nowrap; }
  .brand::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-inline-start: 5px; border-radius: 2px; background: var(--cyan); }
  .brand:hover { color: var(--text); }
  .nav { display: flex; flex-wrap: wrap; gap: 26px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; }
  .nav a { color: var(--soft); text-decoration: none; }
  .nav a:hover { color: var(--text); }
  .nav .strong { color: var(--cyan); }
  .tools { display: flex; gap: 10px; align-items: center; position: relative; }
  .menu { display: none; }
  .langs summary { gap: 8px; }
  .langs:not([open]) ul, .menu:not([open]) .nav { display: none; }
  .langs .lcode { display: none; }
  @media (max-width: 960px) { .langs .lname { display: none; } .langs .lcode { display: inline; } .top { gap: 12px; } .menu summary, .langs summary { padding: 0 14px; } }
  @media (max-width: 400px) { .brand { font-size: 18px; } }
  @media (max-width: 370px) { .langs .lcode { display: none; } .brand { font-size: 16px; } .top { gap: 6px; } .tools { gap: 6px; } .menu summary, .langs summary { padding: 0 10px; font-size: 13px; } }
  .langs ul { position: absolute; inset-inline-end: 0; top: 52px; z-index: 6; list-style: none; margin: 0; padding: 10px; background: var(--card); border: 1px solid var(--line2); border-radius: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; width: min(360px, calc(100vw - 48px)); max-height: 75vh; overflow: auto; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .langs a { display: block; padding: 9px 12px; color: var(--soft); text-decoration: none; border-radius: 8px; font-size: 15px; }
  .langs a:hover, .langs a[aria-current] { color: var(--text); background: var(--cyan-soft); }
  .nolatin .eyebrow, .nolatin .hero h1 { letter-spacing: 0; }
  h1, h2, blockquote, .press-item .title { overflow-wrap: break-word; }
  .menu summary, .langs summary { list-style: none; cursor: pointer; min-height: 44px; padding: 0 18px; display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--soft); text-transform: uppercase; letter-spacing: .8px; }
  .menu[open] summary, .langs[open] summary { border-color: var(--cyan); color: var(--text); }
  .menu summary::-webkit-details-marker, .langs summary::-webkit-details-marker { display: none; }
  .menu .nav { position: absolute; inset-inline-end: 0; top: 52px; z-index: 5; flex-direction: column; gap: 4px; background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 10px; min-width: 220px; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .menu .nav a { padding: 10px 12px; }
  @media (max-width: 960px) { .top > .nav { display: none; } .menu { display: block; } }

  /* Hero: same text + portrait layout, dark tech treatment */
  .hero { position: relative; isolation: isolate; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; padding-top: 40px; padding-bottom: 88px; }
  .hero::before { content: ""; position: absolute; z-index: -1; width: min(760px, 70vw); aspect-ratio: 1; inset-inline-end: 0; top: -220px; background: radial-gradient(circle, rgba(0,229,255,.13), transparent 62%); pointer-events: none; }
  .hero-text { flex: 1 1 560px; display: flex; flex-direction: column; gap: 26px; min-width: 0; }
  .hero h1 { margin: 0; font-size: clamp(30px, 4.2vw, 58px); line-height: 1.03; text-wrap: balance; }
  .hero .lede { font-size: 20px; color: var(--soft); max-width: 540px; text-wrap: pretty; }
  .ctas { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .ctas .link { color: var(--text); text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; font-size: 15px; padding: 15px 10px; }
  .ctas .link::after { content: " →"; color: var(--cyan); }
  .ctas .link:hover { color: var(--cyan); }
  [dir="rtl"] .ctas .link::after { content: " ←"; }
  .portrait { flex: 0 1 440px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .portrait .frame { position: relative; aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; background: var(--card); box-shadow: 0 30px 80px -30px var(--cyan-glow); }
  .portrait .frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--cyan); background: linear-gradient(to bottom, rgba(8,10,14,0) 62%, rgba(8,10,14,.7)); pointer-events: none; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .portrait figcaption { font-size: 14px; color: var(--muted); }

  /* Stats */
  .stats { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--band); }
  .stats .wrap { padding-top: 36px; padding-bottom: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 28px 24px; }
  .stat .num { font-weight: 900; font-size: clamp(34px, 9vw, 52px); line-height: 1; color: var(--cyan); }
  .stat .label { margin-top: 8px; font-size: 15px; color: var(--soft); }

  /* The Home+ build */
  .build { background: radial-gradient(900px 480px at 15% 0%, rgba(0,229,255,.07), transparent 65%), var(--bg); }
  .build .wrap { padding-top: 88px; padding-bottom: 88px; display: flex; flex-direction: column; gap: 48px; }
  .build .eyebrow { margin-bottom: 14px; }
  .build h2 { margin: 0 0 18px; font-size: clamp(30px, 4vw, 52px); line-height: 1.04; text-wrap: balance; }
  .build .intro { max-width: 860px; }
  .build .intro p:not(.eyebrow) { font-size: 19px; color: var(--soft); text-wrap: pretty; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 24px; counter-reset: shot; }
  .shot { margin: 0; display: flex; flex-direction: column; gap: 16px; background: var(--card); border-radius: var(--r); padding: 12px 12px 22px; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 300ms, transform 400ms var(--ease); }
  .shot:hover { box-shadow: inset 0 0 0 2px var(--cyan); transform: translateY(-3px); }
  .shot .frame { aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: #141925; }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .shot img.contain { object-fit: contain; background: #fff; }
  .shot figcaption { display: flex; flex-direction: column; gap: 6px; padding: 0 8px; }
  .shot b { counter-increment: shot; font-weight: 800; font-size: 20px; text-transform: uppercase; }
  .shot b::before { content: "0" counter(shot) "\00a0\00a0"; color: var(--cyan); font-size: 14px; letter-spacing: 1px; vertical-align: 2px; }
  .shot span { font-size: 16px; color: var(--soft); }

  /* Story + timeline */
  .story { padding-top: 88px; padding-bottom: 88px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 56px; }
  .story-text { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .story blockquote, .techeo blockquote { margin: 0; font-weight: 700; color: var(--text); line-height: 1.22; text-wrap: pretty; padding-inline-start: 22px; border-inline-start: 4px solid var(--cyan); }
  .story blockquote { font-size: clamp(24px, 2.8vw, 36px); }
  .story .body { font-size: 18px; color: var(--soft); text-wrap: pretty; }
  .story .fact { font-size: 16px; color: var(--muted); text-wrap: pretty; }
  .story .fact a { color: var(--text); text-decoration-color: var(--cyan); text-underline-offset: 3px; }
  .timeline { list-style: none; margin: 0; padding: 0; padding-inline-start: 28px; display: flex; flex-direction: column; gap: 28px; border-inline-start: 2px solid var(--line2); border-image: linear-gradient(to bottom, var(--line2), var(--cyan)) 1; }
  .timeline li { position: relative; }
  .timeline li::before { content: ""; position: absolute; inset-inline-start: -36px; top: 5px; width: 12px; height: 12px; border-radius: 3px; background: var(--bg); border: 2px solid var(--line2); }
  .timeline li:last-child::before { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 0 5px var(--cyan-soft); }
  .timeline .when { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); text-transform: uppercase; }
  .timeline .cold { color: var(--muted); }
  .timeline .warm { color: var(--cyan); }
  .timeline .what { margin-top: 2px; font-weight: 800; font-size: 19px; text-transform: uppercase; }
  .timeline .note { margin-top: 2px; font-size: 15px; color: var(--soft); }

  /* Takeo.AI band */
  .takeo { background: var(--band); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .takeo .wrap { padding-top: 80px; padding-bottom: 80px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 48px; align-items: center; }
  .takeo-text { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .takeo h2 { margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.05; text-transform: none; }
  .takeo-text p:not(.eyebrow) { font-size: 18px; color: var(--soft); text-wrap: pretty; }
  .takeo .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 24px; }
  .takeo .fig { border-top: 2px solid var(--cyan); padding-top: 18px; }
  .takeo .fig .num { font-weight: 900; font-size: clamp(40px, 4.4vw, 60px); line-height: 1; color: var(--text); }
  .takeo .fig .label { margin-top: 8px; font-size: 15px; color: var(--soft); }
  .more { font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: .8px; font-size: 14px; }

  /* Why Techeo */
  .techeo { padding-top: 96px; padding-bottom: 96px; display: flex; flex-direction: column; gap: 28px; }
  .techeo blockquote { max-width: 960px; font-size: clamp(26px, 3.4vw, 46px); line-height: 1.14; }
  .techeo .body { max-width: 720px; font-size: 19px; color: var(--soft); text-wrap: pretty; }

  /* Companies */
  .ventures { padding-bottom: 96px; }
  .ventures h2 { margin: 0 0 32px; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.05; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 20px; }
  .card { position: relative; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; padding: 28px; color: var(--text); text-decoration: none; display: flex; flex-direction: column; gap: 10px; transition: box-shadow 300ms, transform 400ms var(--ease); }
  .card::after { content: "→"; position: absolute; inset-inline-end: 24px; top: 22px; color: var(--cyan); font-size: 22px; font-weight: 700; transition: transform 300ms var(--ease); }
  [dir="rtl"] .card::after { content: "←"; }
  .card:hover { box-shadow: inset 0 0 0 2px var(--cyan); color: var(--text); transform: translateY(-3px); }
  .card:hover::after { transform: translateX(4px); }
  .card .role { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: var(--cyan); }
  .card .name { font-size: 24px; font-weight: 800; text-transform: uppercase; }
  .card .desc { color: var(--soft); font-size: 16px; }
  .also { margin-top: 20px; font-size: 15px; color: var(--muted); }
  .also a { color: var(--text); text-decoration-color: var(--cyan); text-underline-offset: 3px; }

  /* Press */
  .press { padding-bottom: 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 20px; }
  .press-item { border-top: 2px solid var(--line2); padding-top: 22px; color: var(--text); text-decoration: none; display: flex; flex-direction: column; gap: 10px; transition: border-color 300ms; }
  .press-item:hover { color: var(--text); border-top-color: var(--cyan); }
  .press-item .kind { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); }
  .press-item .title { font-weight: 800; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.15; }
  .press-item .go { font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: .8px; font-size: 14px; }

  /* New: content */
  .content { padding-top: 88px; padding-bottom: 88px; border-top: 1px solid var(--line); }
  .content-head { display: grid; gap: 14px; align-items: end; }
  .content h2, .follow h2 { margin: 12px 0 0; font-size: clamp(30px, 3.6vw, 48px); line-height: 1.05; max-width: 18ch; }
  .content .sub { color: var(--soft); max-width: 40ch; }
  @media (min-width: 900px) { .content-head { grid-template-columns: 1.4fr 1fr; } }
  .media-row { display: grid; grid-auto-flow: column; grid-auto-columns: min(78%, 320px); gap: 16px; margin-top: 36px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
  .media-row::-webkit-scrollbar { display: none; }
  @media (min-width: 900px) { .media-row { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); overflow: visible; } }
  .media { display: flex; flex-direction: column; scroll-snap-align: start; border-radius: var(--r); overflow: hidden; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); text-decoration: none; transition: box-shadow 300ms, transform 400ms var(--ease); }
  .media:hover { color: var(--text); box-shadow: inset 0 0 0 2px var(--cyan); transform: translateY(-3px); }
  .media img, .video-frame { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  .video-frame { display: grid; place-items: center; background: radial-gradient(circle, rgba(0,229,255,.16), transparent 60%), var(--band); }
  .play { width: 76px; height: 76px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--cyan); position: relative; }
  .play::after { content: ""; position: absolute; left: 31px; top: 23px; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 22px solid var(--cyan); }
  .media-cap { padding: 14px 16px 18px; display: grid; gap: 4px; border-top: 1px solid var(--line); flex: 1; align-content: start; }
  .kind { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
  .mt { font-weight: 700; line-height: 1.3; }
  .media .go { color: var(--cyan); font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: .8px; }
  .series { margin-top: 32px; }
  .series ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; }
  .series li { font-weight: 700; padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
  .series li::before { content: "→"; color: var(--cyan); }
  [dir="rtl"] .series li::before { content: "←"; }
  @media (min-width: 760px) { .series ul { grid-template-columns: 1fr 1fr; column-gap: 32px; } }

  /* New: follow */
  .follow { background: var(--band); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .follow .wrap { padding-top: 80px; padding-bottom: 80px; }
  .socials { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
  .social { position: relative; display: grid; gap: 2px; padding: 22px 56px 22px 22px; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); text-decoration: none; transition: box-shadow 300ms, transform 400ms var(--ease); }
  .social:hover { color: var(--text); box-shadow: inset 0 0 0 2px var(--cyan); transform: translateY(-3px); }
  .social .net { font-size: 24px; font-weight: 800; text-transform: uppercase; }
  .social .handle { color: var(--cyan); font-weight: 700; }
  .social .what { color: var(--soft); font-size: 15px; }
  .social .go { position: absolute; inset-inline-end: 22px; top: 22px; color: var(--cyan); font-size: 24px; font-weight: 700; }

  /* New: lead block */
  .guide { padding-top: 96px; padding-bottom: 96px; }
  .guide-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px; border-radius: 22px; padding: clamp(28px, 5vw, 64px); background: var(--band); box-shadow: inset 0 0 0 2px var(--cyan); }
  .guide-card::before { content: ""; position: absolute; width: 640px; height: 640px; inset-inline-end: -240px; top: -300px; background: radial-gradient(circle, rgba(0,229,255,.2), transparent 62%); pointer-events: none; }
  .guide-card > * { position: relative; }
  .guide h2 { margin: 0; font-size: clamp(34px, 5vw, 68px); line-height: 1; font-weight: 900; }
  .guide .body { max-width: 56ch; font-size: 18px; color: var(--soft); }
  .guide .note { font-size: 14px; color: var(--muted); max-width: 52ch; }

  /* Footer */
  .foot { border-top: 1px solid var(--line); }
  .foot .wrap { padding-top: 36px; padding-bottom: 52px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; font-size: 15px; color: var(--muted); }
  .foot nav { display: flex; flex-wrap: wrap; gap: 12px 20px; }
  .foot nav a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line2); }
  .foot nav a:hover { color: var(--cyan); border-color: var(--cyan); }
</style>
