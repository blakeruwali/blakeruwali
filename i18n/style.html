<style>
  :root {
    --bg: #101111; --band: #191A1A; --line: #2A2B2A; --line2: #3A3B38;
    --text: #F3F1EC; --soft: #C9C6BE; --muted: #A9A69E;
    --paper: #F3F1EC; --ink: #141413; --ink-soft: #4A4945; --paper-line: #D6D2C4;
    --warm: #F0A23B; --warm-hi: #FFC572; --warm-ink: #8A4B00; --cold: #7FB2F0;
    --serif: Newsreader, Georgia, serif; --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--sans); }
  a { color: var(--warm); }
  a:hover { color: var(--warm-hi); }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; border-radius: 6px; }
  img { display: block; max-width: 100%; }
  p { margin: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  .eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: 2px; color: var(--warm); text-transform: uppercase; }
  .serif { font-family: var(--serif); font-weight: 400; }
  .btn { display: inline-block; background: var(--warm); color: #101111; text-decoration: none; font-weight: 600; padding: 15px 26px; border-radius: 999px; }
  .btn:hover { background: var(--warm-hi); color: #101111; }
  .skip { position: absolute; top: 16px; inset-inline-start: 16px; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .skip:focus { width: auto; height: auto; clip-path: none; background: var(--warm); color: #101111; padding: 10px 16px; z-index: 10; }

  .top { display: flex; gap: 20px; align-items: center; justify-content: space-between; padding-top: 24px; padding-bottom: 24px; }
  .brand { font-family: var(--serif); font-size: 28px; color: var(--text); text-decoration: none; }
  .nav { display: flex; flex-wrap: wrap; gap: 28px; font-size: 15px; }
  .nav a { color: var(--soft); text-decoration: none; }
  .nav a:hover { color: var(--text); }
  .nav .strong { color: var(--text); font-weight: 600; }
  .tools { display: flex; gap: 10px; align-items: center; position: relative; }
  .menu { display: none; }
  .langs summary { gap: 8px; }
  .langs:not([open]) ul, .menu:not([open]) .nav { display: none; }
  .langs .lcode { display: none; }
  .brand { white-space: nowrap; }
  @media (max-width: 720px) { .langs .lname { display: none; } .langs .lcode { display: inline; } .top { gap: 12px; } .menu summary, .langs summary { padding: 0 14px; } }
  @media (max-width: 400px) { .brand { font-size: 24px; } }
  @media (max-width: 370px) { .langs .lcode { display: none; } .top { gap: 8px; } .tools { gap: 8px; } .menu summary, .langs summary { padding: 0 12px; } }
  .langs ul { position: absolute; inset-inline-end: 0; top: 52px; z-index: 6; list-style: none; margin: 0; padding: 10px; background: var(--band); border: 1px solid var(--line2); border-radius: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; width: min(360px, calc(100vw - 48px)); max-height: 75vh; overflow: auto; }
  .langs a { display: block; padding: 9px 12px; color: var(--soft); text-decoration: none; border-radius: 8px; font-size: 15px; }
  .langs a:hover, .langs a[aria-current] { color: var(--text); background: #242524; }
  .nolatin .eyebrow, .nolatin .hero h1 { letter-spacing: 0; }
  h1, h2, blockquote, .press-item .title { overflow-wrap: break-word; }
  .nolatin .hero h1, .nolatin h2, .nolatin blockquote { line-height: 1.3; }
  :lang(ta) .hero h1, :lang(te) .hero h1, :lang(ml) .hero h1 { font-size: clamp(30px, 4.4vw, 60px); line-height: 1.2; }
  .nolatin .eyebrow { font-family: var(--sans); font-weight: 600; }
  .menu summary, .langs summary { list-style: none; cursor: pointer; min-height: 44px; padding: 0 18px; display: inline-flex; align-items: center; border: 1px solid #4A4A46; border-radius: 999px; font-weight: 500; font-size: 15px; }
  .menu summary::-webkit-details-marker, .langs summary::-webkit-details-marker { display: none; }
  .menu .nav { position: absolute; inset-inline-end: 0; top: 52px; z-index: 5; flex-direction: column; gap: 4px; background: var(--band); border: 1px solid var(--line2); border-radius: 14px; padding: 10px; min-width: 220px; }
  .menu .nav a { padding: 10px 12px; }
  @media (max-width: 720px) { .top > .nav { display: none; } .menu { display: block; } }

  .hero { display: flex; flex-wrap: wrap; gap: 48px; align-items: center; padding-top: 40px; padding-bottom: 88px; }
  .hero-text { flex: 1 1 560px; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  .hero h1 { margin: 0; font-size: clamp(38px, 5vw, 70px); line-height: 1.04; letter-spacing: -0.5px; text-wrap: balance; }
  .hero .lede { font-size: 20px; color: var(--soft); max-width: 540px; text-wrap: pretty; }
  .ctas { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .ctas .link { color: var(--text); text-decoration: none; font-weight: 500; padding: 15px 10px; }
  .portrait { flex: 0 1 440px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .portrait .frame { aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; background: #1C1D1C; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .portrait figcaption { font-size: 14px; color: var(--muted); }

  .stats { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats .wrap { padding-top: 36px; padding-bottom: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 28px 24px; }
  .stat .num { font-family: var(--serif); font-size: 52px; line-height: 1; color: var(--warm); }
  .stat .label { margin-top: 8px; font-size: 15px; color: var(--muted); }

  .build { background: var(--paper); color: var(--ink); }
  .build .wrap { padding-top: 88px; padding-bottom: 88px; display: flex; flex-direction: column; gap: 48px; }
  .build .eyebrow { color: var(--warm-ink); margin-bottom: 14px; }
  .build h2 { margin: 0 0 18px; font-size: clamp(34px, 4.4vw, 58px); line-height: 1.08; text-wrap: balance; }
  .build .intro { max-width: 820px; }
  .build .intro p { font-size: 19px; color: var(--ink-soft); text-wrap: pretty; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 28px; }
  .shot { margin: 0; display: flex; flex-direction: column; gap: 14px; }
  .shot .frame { aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #141925; border: 1px solid var(--paper-line); }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .shot img.contain { object-fit: contain; }
  .shot figcaption { display: flex; flex-direction: column; gap: 4px; }
  .shot b { font-weight: 600; font-size: 19px; }
  .shot span { font-size: 16px; color: var(--ink-soft); }

  .story { padding-top: 88px; padding-bottom: 88px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 56px; }
  .story-text { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .story blockquote { margin: 0; font-family: var(--serif); font-size: clamp(28px, 3.2vw, 42px); line-height: 1.2; text-wrap: pretty; }
  .story .body { font-size: 18px; color: var(--soft); text-wrap: pretty; }
  .story .fact { font-size: 16px; color: var(--muted); text-wrap: pretty; }
  .timeline { list-style: none; margin: 0; padding: 0; padding-inline-start: 24px; display: flex; flex-direction: column; gap: 26px; border-inline-start: 2px solid var(--cold); border-image: linear-gradient(to bottom, var(--cold), var(--warm)) 1; }
  .timeline .when { font-family: var(--mono); font-size: 13px; color: var(--soft); text-transform: uppercase; }
  .timeline .cold { color: var(--cold); }
  .timeline .warm { color: var(--warm); }
  .timeline .what { margin-top: 2px; font-weight: 600; }
  .timeline .note { margin-top: 2px; font-size: 15px; color: var(--muted); }

  .takeo { background: var(--band); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .takeo .wrap { padding-top: 80px; padding-bottom: 80px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 48px; align-items: center; }
  .takeo-text { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .takeo h2 { margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.1; }
  .takeo-text p:not(.eyebrow) { font-size: 18px; color: var(--soft); text-wrap: pretty; }
  .takeo .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 24px; }
  .takeo .fig { border-top: 1px solid var(--line2); padding-top: 18px; }
  .takeo .fig .num { font-family: var(--serif); font-size: clamp(40px, 4.4vw, 60px); line-height: 1; }
  .takeo .fig .label { margin-top: 8px; font-size: 15px; color: var(--muted); }
  .more { font-weight: 600; text-decoration: none; }

  .techeo { padding-top: 96px; padding-bottom: 96px; display: flex; flex-direction: column; gap: 28px; }
  .techeo blockquote { margin: 0; max-width: 960px; font-family: var(--serif); font-size: clamp(30px, 4vw, 54px); line-height: 1.12; text-wrap: balance; }
  .techeo .body { max-width: 720px; font-size: 19px; color: var(--soft); text-wrap: pretty; }

  .ventures { padding-bottom: 96px; }
  .ventures h2 { margin: 0 0 32px; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 20px; }
  .card { background: var(--band); border: 1px solid var(--line); border-radius: 16px; padding: 28px; color: var(--text); text-decoration: none; display: flex; flex-direction: column; gap: 10px; }
  .card:hover { border-color: #4A4A46; color: var(--text); }
  .card .role { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card .name { font-size: 23px; font-weight: 600; }
  .card .desc { color: var(--soft); font-size: 16px; }
  .also { margin-top: 20px; font-size: 15px; color: var(--muted); }

  .press { padding-bottom: 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 20px; }
  .press-item { border-top: 1px solid var(--line2); padding-top: 22px; color: var(--text); text-decoration: none; display: flex; flex-direction: column; gap: 10px; }
  .press-item:hover { color: var(--text); }
  .press-item .kind { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .press-item .title { font-family: var(--serif); font-size: 30px; line-height: 1.2; }
  .press-item .go { font-weight: 600; color: var(--warm); }

  .foot { border-top: 1px solid var(--line); }
  .foot .wrap { padding-top: 36px; padding-bottom: 52px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; font-size: 15px; color: var(--muted); }
  .foot nav { display: flex; flex-wrap: wrap; gap: 20px; }
  .foot nav a { color: var(--soft); }
</style>
