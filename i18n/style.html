<style>
:root {
  --bg: #080A0E;
  --card: #141A22;
  --card-2: #0E131A;
  --line: #1F2833;
  --cyan: #00E5FF;
  --cyan-soft: rgba(0, 229, 255, .14);
  --white: #FFFFFF;
  --grey: #BEC8D2;
  --dim: #828C96;

  --font: "Avenir Next", "Avenir", Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
  --w-heavy: 800;
  --w-black: 900;

  --text-base: clamp(1rem, .95rem + .25vw, 1.125rem);
  --text-lede: clamp(1.0625rem, .98rem + .45vw, 1.3125rem);
  --text-h2: clamp(1.9rem, 1.2rem + 3vw, 3.6rem);
  --text-mega: clamp(2.9rem, 1.2rem + 7.4vw, 7.6rem);
  --text-mega-md: clamp(2.4rem, 1.2rem + 5vw, 5.4rem);

  --gutter: clamp(16px, 4vw, 56px);
  --space-section: clamp(4.5rem, 3rem + 6vw, 9rem);
  --radius: 14px;
  --radius-sm: 10px;

  --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
  --dur: 700ms;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--grey);
  font-family: var(--font); font-weight: 500; font-size: var(--text-base); line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, ol, ul, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter); }
.skip { position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--cyan); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 700; }
.skip:focus { left: 8px; }

/* Type */
.mega, .h2, h3, .brand, .co-title, .num, .net {
  font-family: var(--font); color: var(--white); text-transform: uppercase;
  font-weight: var(--w-heavy); letter-spacing: -.01em; line-height: 1.02;
}
.mega { font-size: var(--text-mega); font-weight: var(--w-black); line-height: .98; }
.mega-md { font-size: var(--text-mega-md); }
.h2 { font-size: var(--text-h2); line-height: 1.04; }
.narrow { max-width: 18ch; }
.eyebrow { color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; margin-bottom: 1rem; }
.lede { font-size: var(--text-lede); color: var(--grey); max-width: 40ch; }
.lede-sm { max-width: 36ch; }
.tag { color: var(--dim); text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; font-weight: 700; }

/* Pill + arrow (from the carousel system) */
.pill {
  display: inline-block; background: var(--cyan); color: var(--bg);
  font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
  font-size: clamp(.85rem, .8rem + .3vw, 1.05rem); line-height: 1;
  padding: .55em .8em .5em; border-radius: var(--radius-sm);
}
.pill-sm { font-size: .78rem; padding: .7em .9em .65em; transition: transform 200ms var(--ease-out-expo), box-shadow 200ms; }
.pill-sm:hover { transform: translateY(-1px); box-shadow: 0 0 0 4px var(--cyan-soft); }
.arrow {
  --len: .9em; --head: .32em; --stroke: .12em;
  position: relative; display: inline-block; width: calc(var(--len) + var(--head)); height: calc(var(--head) * 2);
  vertical-align: .14em; margin-inline-start: .15em;
}
.arrow::before { content: ""; position: absolute; inset-inline-start: 0; top: 50%; width: var(--len); height: var(--stroke); background: var(--cyan); transform: translateY(-50%); }
.arrow::after {
  content: ""; position: absolute; inset-inline-end: 0; top: 0; width: 0; height: 0;
  border-top: var(--head) solid transparent; border-bottom: var(--head) solid transparent; border-inline-start: calc(var(--head) * 1.3) solid var(--cyan);
}
[dir="rtl"] .arrow { transform: scaleX(-1); }
.arrow-sm { --len: 1.1em; --head: .38em; --stroke: .16em; vertical-align: .02em; transition: transform 250ms var(--ease-out-expo); }

/* Buttons */
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 2rem; }
.btn {
  display: inline-flex; align-items: center; gap: .55em; min-height: 52px; padding: 0 1.4em;
  border-radius: var(--radius-sm); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: .92rem;
  background: var(--white); color: var(--bg); transition: transform 250ms var(--ease-out-expo), box-shadow 250ms, background 250ms;
}
.btn .arrow::before { background: var(--bg); }
.btn .arrow::after { border-inline-start-color: var(--bg); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px rgba(0, 229, 255, .55); background: var(--cyan); }
.btn:hover .arrow, a:hover > .arrow, a:hover .go .arrow { transform: translateX(4px); }
.btn:active { transform: translateY(0); }
.btn-ghost { background: transparent; color: var(--white); box-shadow: inset 0 0 0 2px var(--cyan); }
.btn-ghost:hover { background: var(--cyan-soft); color: var(--white); box-shadow: inset 0 0 0 2px var(--cyan), 0 10px 30px -12px rgba(0, 229, 255, .5); }

/* Header */
.top { position: fixed; inset: 0 0 auto 0; z-index: 20; background: linear-gradient(to bottom, rgba(8,10,14,.85), rgba(8,10,14,0)); backdrop-filter: blur(0px); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 68px; }
.brand { font-size: 1.05rem; font-weight: var(--w-black); letter-spacing: .02em; display: inline-flex; align-items: center; }
.dot { width: .42em; height: .42em; border-radius: 2px; background: var(--cyan); margin-inline-start: .3em; }
.nav { display: none; gap: 28px; }
.nav a { color: var(--grey); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .78rem; padding: 6px 0; position: relative; }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--cyan); transform: scaleX(0); transform-origin: left; transition: transform 300ms var(--ease-out-expo); }
.nav a:hover { color: var(--white); }
.nav a:hover::after { transform: scaleX(1); }
.tools { display: flex; align-items: center; gap: 10px; }
.langs { position: relative; }
.langs summary { list-style: none; cursor: pointer; color: var(--grey); font-weight: 700; font-size: .78rem; letter-spacing: .08em; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.langs summary::-webkit-details-marker { display: none; }
.langs[open] summary { border-color: var(--cyan); color: var(--white); }
.langs ul { position: absolute; inset-inline-end: 0; top: calc(100% + 8px); width: 200px; max-height: 60vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.langs a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--grey); font-size: .92rem; }
.langs a:hover, .langs a[aria-current] { background: var(--cyan-soft); color: var(--white); }
.brand, .pill-sm { white-space: nowrap; }
@media (max-width: 379px) {
  .brand { font-size: .9rem; }
  .tools { gap: 6px; }
  .pill-sm { font-size: .7rem; padding: .7em .7em .65em; }
  .langs summary { padding: 7px 8px; font-size: .72rem; }
}
@media (min-width: 900px) { .nav { display: flex; } }

/* Hero */
.hero { position: relative; min-height: 100svh; display: flex; align-items: flex-end; isolation: isolate; padding-bottom: clamp(2.5rem, 5vw, 5rem); }
.hero-photo { position: absolute; inset: 0 0 auto 0; height: 78svh; z-index: -1; overflow: hidden; }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: saturate(.85); animation: settle 1.6s var(--ease-out-expo) both; }
.hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(8,10,14,.15) 0%, rgba(8,10,14,0) 25%, rgba(8,10,14,.55) 62%, var(--bg) 100%); }
.hero-text { padding-top: 46svh; }
.hero-text > * { animation: rise 900ms var(--ease-out-expo) both; }
.hero-text > :nth-child(2) { animation-delay: 80ms; }
.hero-text > :nth-child(3) { animation-delay: 160ms; }
.hero-text > :nth-child(4) { animation-delay: 240ms; }
.hero .pill { margin-bottom: 1.1rem; }
/* The longest line ("LONG ISLAND →") is ~8.6em in Avenir Next, ~9.3em in Montserrat: size it to fit the column. */
.hero .mega { font-size: min(var(--text-mega), calc((100vw - 2 * var(--gutter)) / 9.4)); }
.hero .mega .ln { display: block; white-space: nowrap; }
.hero .lede { margin-top: 1.25rem; }
@media (min-width: 900px) {
  .hero { align-items: center; padding-bottom: 0; }
  .hero .mega { font-size: min(5.1vw, 6.2rem); }
  .hero-text > * { max-width: 50vw; }
  .hero-photo { inset: 0 0 0 auto; width: min(58vw, 1000px); height: 100%; }
  .hero-photo img { object-position: 50% 30%; }
  .hero-photo::after { background:
      linear-gradient(to right, var(--bg) 0%, rgba(8,10,14,.75) 22%, rgba(8,10,14,0) 55%),
      linear-gradient(to bottom, rgba(8,10,14,.5) 0%, rgba(8,10,14,0) 20%, rgba(8,10,14,0) 70%, var(--bg) 100%); }
  [dir="rtl"] .hero-photo { inset: 0 auto 0 0; }
  .hero-text { padding-top: 96px; padding-bottom: 72px; }
}
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes settle { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }

/* Stats */
.stats { border-block: 1px solid var(--line); background: var(--card-2); }
.stat-row { display: grid; grid-template-columns: 1fr; }
.stat { padding: 1.3rem 0; display: grid; grid-template-columns: 8.4rem 1fr; align-items: baseline; gap: 1rem; }
.stat + .stat { border-top: 1px solid var(--line); }
.num { font-size: clamp(1.8rem, 1.4rem + 2vw, 3rem); color: var(--cyan); font-weight: var(--w-black); }
.label { font-size: .92rem; color: var(--grey); max-width: 26ch; line-height: 1.4; }
@media (min-width: 760px) {
  .stat-row { grid-template-columns: repeat(3, 1fr); }
  .stat { grid-template-columns: 1fr; gap: .4rem; padding: 2rem 1.5rem; }
  .stat:first-child { padding-inline-start: 0; }
  .stat + .stat { border-top: 0; border-inline-start: 1px solid var(--line); }
}

/* Sections */
.section { padding-block: var(--space-section); }
h3 { font-size: clamp(1.3rem, 1.1rem + .8vw, 1.75rem); margin: .35rem 0 .5rem; }

/* Story */
.story-grid { display: grid; gap: 2.5rem; }
.story-photo { margin-top: 2rem; border-radius: var(--radius); overflow: hidden; position: relative; aspect-ratio: 4 / 5; max-width: 420px; }
.story-photo img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85); }
.story-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(8,10,14,0) 55%, var(--bg)); }
.steps { position: relative; display: grid; gap: 0; }
.steps::before { content: ""; position: absolute; inset-inline-start: 19px; top: 24px; bottom: 24px; width: 2px; background: linear-gradient(var(--line), var(--cyan)); }
.step { position: relative; padding: 0 0 2.2rem 64px; }
[dir="rtl"] .step { padding: 0 64px 2.2rem 0; }
.step .idx {
  position: absolute; inset-inline-start: 0; top: 0; width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; background: var(--bg); border: 2px solid var(--line);
  color: var(--white); font-weight: 800; font-size: .8rem;
}
.step-now .idx { background: var(--cyan); border-color: var(--cyan); color: var(--bg); box-shadow: 0 0 0 6px var(--cyan-soft); }
.step p:last-child { max-width: 46ch; }
.edu { color: var(--dim); font-size: .85rem; border-top: 1px solid var(--line); padding-top: 1.2rem; }
@media (min-width: 900px) {
  .story-grid { grid-template-columns: 5fr 6fr; column-gap: clamp(3rem, 6vw, 7rem); align-items: start; }
  .story-head { position: sticky; top: 100px; }
  .steps { padding-top: .5rem; }
  .edu { grid-column: 1 / -1; }
}

/* Now */
.now { background: radial-gradient(900px 520px at 85% 38%, rgba(0,229,255,.07), transparent 70%); }
.co-grid { display: grid; gap: 18px; margin-top: 2.5rem; }
.co {
  position: relative; display: grid; border-radius: var(--radius); overflow: hidden; min-height: 520px;
  background: var(--card); box-shadow: inset 0 0 0 1px var(--line); isolation: isolate;
  transition: transform 400ms var(--ease-out-expo), box-shadow 400ms;
}
.co img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; filter: saturate(.8); transition: transform 900ms var(--ease-out-expo); }
.co::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(8,10,14,.1) 0%, rgba(8,10,14,.35) 35%, rgba(8,10,14,.92) 68%, var(--bg) 100%); }
.co-body { align-self: end; padding: clamp(1.25rem, 3vw, 2.25rem); display: grid; gap: .8rem; justify-items: start; }
.co-title { font-size: clamp(1.9rem, 1.4rem + 2vw, 2.9rem); }
.co-text { color: var(--grey); max-width: 44ch; }
.go { color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; display: inline-flex; align-items: center; gap: .5em; }
.co:hover { transform: translateY(-4px); box-shadow: inset 0 0 0 2px var(--cyan), 0 30px 60px -30px rgba(0,229,255,.35); }
.co:hover img { transform: scale(1.04); }
.flow { display: grid; gap: 12px; margin-top: 18px; }
.flow li { background: var(--card); border-radius: var(--radius); padding: 1.4rem; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 300ms; }
.flow li:hover { box-shadow: inset 0 0 0 2px var(--cyan); }
.flow .idx { color: var(--cyan); font-weight: 800; font-size: .8rem; letter-spacing: .1em; }
.flow h3 { font-size: 1.3rem; }
.flow p { font-size: .95rem; }
@media (min-width: 760px) {
  .co-grid { grid-template-columns: 1.15fr 1fr; }
  .co { min-height: 600px; }
  .flow { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1100px) { .flow { grid-template-columns: repeat(4, 1fr); } }

/* Content */
.content-head { display: grid; gap: 1.2rem; align-items: end; }
@media (min-width: 900px) { .content-head { grid-template-columns: 1.4fr 1fr; } }
.media-row { display: grid; grid-auto-flow: column; grid-auto-columns: min(78%, 320px); gap: 14px; margin-top: 2.5rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); scrollbar-width: none; }
.media-row::-webkit-scrollbar { display: none; }
.media { position: relative; display: flex; flex-direction: column; scroll-snap-align: start; border-radius: var(--radius); overflow: hidden; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); transition: transform 400ms var(--ease-out-expo), box-shadow 300ms; }
.media img, .video-frame { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.media-cap { padding: 1rem 1.1rem 1.15rem; display: grid; gap: .25rem; flex: 1; align-content: start; border-top: 1px solid var(--line); }
.kind { color: var(--cyan); font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.mt { color: var(--white); font-weight: 700; line-height: 1.25; }
.media:hover { transform: translateY(-4px); box-shadow: inset 0 0 0 2px var(--cyan); }
.video-frame { display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, rgba(0,229,255,.16), transparent 60%), var(--card-2); }
.play { width: 78px; height: 78px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--cyan); position: relative; transition: background 300ms; }
.play::after { content: ""; position: absolute; left: 32px; top: 24px; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 22px solid var(--cyan); }
.media-video:hover .play { background: var(--cyan-soft); }
@media (min-width: 900px) {
  .media-row { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); overflow: visible; margin-inline: 0; padding-inline: 0; }
}
.series { margin-top: 2rem; border-top: 1px solid var(--line); padding-top: 1.4rem; }
.series ul { display: grid; gap: 0; margin-top: .8rem; }
.series li { color: var(--white); font-weight: 700; padding: .8rem 0; border-bottom: 1px solid var(--line); display: flex; gap: .8rem; }
.series li::before { content: "→"; color: var(--cyan); }
[dir="rtl"] .series li::before { content: "←"; }
@media (min-width: 760px) { .series ul { grid-template-columns: repeat(2, 1fr); column-gap: 2rem; } }

/* Follow */
.socials { display: grid; gap: 12px; margin-top: 2.5rem; }
.social {
  position: relative; display: grid; gap: .2rem; padding: 1.4rem 3.5rem 1.4rem 1.4rem; border-radius: var(--radius);
  background: var(--card); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 300ms, transform 400ms var(--ease-out-expo), background 300ms;
}
.social .net { font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2.1rem); }
.social .handle { color: var(--cyan); font-weight: 700; }
.social .what { color: var(--grey); font-size: .92rem; }
.social > .arrow { position: absolute; inset-inline-end: 1.4rem; top: 1.7rem; font-size: 1.4rem; }
.social:hover { box-shadow: inset 0 0 0 2px var(--cyan); transform: translateY(-3px); background: #17202A; }
@media (min-width: 760px) { .socials { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .socials { grid-template-columns: repeat(4, 1fr); } .social { min-height: 210px; align-content: start; padding-top: 4.2rem; } }

/* Guide (lead capture) */
.guide-card {
  position: relative; overflow: hidden; border-radius: calc(var(--radius) + 6px);
  padding: clamp(1.75rem, 5vw, 4.5rem); background: var(--card-2); box-shadow: inset 0 0 0 2px var(--cyan);
}
.guide-card::before { content: ""; position: absolute; width: 700px; height: 700px; right: -260px; top: -320px; background: radial-gradient(circle, rgba(0,229,255,.22), transparent 62%); pointer-events: none; }
.guide-card > * { position: relative; }
.guide-card .pill { margin-bottom: 1.2rem; }
.guide-card .mega { margin-bottom: 1.2rem; }
.guide-card .how { color: var(--white); font-weight: 700; margin-top: 1rem; }
.guide-card .note { color: var(--dim); font-size: .85rem; margin-top: 1.2rem; max-width: 52ch; }

/* Footer */
.foot { border-top: 1px solid var(--line); padding: 3rem 0 calc(2.5rem + env(safe-area-inset-bottom)); font-size: .9rem; }
.foot-grid { display: grid; gap: 2rem; }
.foot .also { margin-top: .8rem; max-width: 46ch; }
.foot .also a, .foot-links a { color: var(--white); border-bottom: 1px solid var(--line); transition: border-color 200ms, color 200ms; }
.foot .also a:hover, .foot-links a:hover { color: var(--cyan); border-color: var(--cyan); }
.foot .copy { color: var(--dim); margin-top: .8rem; }
.foot-links { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; align-content: start; }
.to-top { color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .78rem; }
@media (min-width: 900px) { .foot-grid { grid-template-columns: 1.2fr 1.5fr auto; } }

/* Scroll reveal */
.js .reveal { opacity: 0; transform: translateY(24px); transition: opacity var(--dur) var(--ease-out-expo), transform var(--dur) var(--ease-out-expo); }
.js .reveal.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
