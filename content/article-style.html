<style>
  /* Guide pages: same dark tech tokens as the homepage (i18n/style.html). */
  :root {
    --bg: #080A0E; --band: #0E131A; --card: #141A22; --line: #1F2833; --line2: #2A3542;
    --text: #FFFFFF; --soft: #BEC8D2; --muted: #828C96;
    --cyan: #00E5FF; --cyan-soft: rgba(0, 229, 255, .14); --cyan-glow: rgba(0, 229, 255, .45);
    --font: "Avenir Next", Avenir, Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 17px/1.7 var(--font); -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: var(--cyan); }
  a:hover { color: var(--text); }
  a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
  img { display: block; max-width: 100%; height: auto; }
  p { margin: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 480px) { .wrap { padding-left: 16px; padding-right: 16px; } }
  .skip { position: absolute; top: 16px; left: 16px; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .skip:focus { width: auto; height: auto; clip-path: none; background: var(--cyan); color: var(--bg); padding: 10px 16px; z-index: 10; }

  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; color: var(--cyan); text-transform: uppercase; }
  .pill { display: inline-block; align-self: flex-start; background: var(--cyan); color: var(--bg); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; font-size: 14px; line-height: 1; padding: 9px 12px 8px; border-radius: 9px; text-decoration: none; }
  .pill-sm { font-size: 12px; padding: 9px 11px 8px; }
  .pill-sm:hover { color: var(--bg); box-shadow: 0 0 0 4px var(--cyan-soft); }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; background: var(--cyan); color: var(--bg); text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; font-size: 15px; padding: 0 22px; border-radius: 10px; transition: transform 250ms var(--ease), box-shadow 250ms; }
  .btn:hover { color: var(--bg); transform: translateY(-2px); box-shadow: 0 12px 32px -12px var(--cyan-glow); }
  .btn-ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px var(--cyan); }
  .btn-ghost:hover { color: var(--text); background: var(--cyan-soft); }
  .ctas { display: flex; flex-wrap: wrap; gap: 14px; }

  /* Header */
  .top { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding-top: 22px; padding-bottom: 22px; }
  .brand { font-weight: 900; text-transform: uppercase; letter-spacing: .4px; font-size: 20px; color: var(--text); text-decoration: none; white-space: nowrap; }
  .brand::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 5px; border-radius: 2px; background: var(--cyan); }
  .brand:hover { color: var(--text); }
  .a-nav { display: flex; align-items: center; gap: 22px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; }
  .a-nav a:not(.pill) { color: var(--soft); text-decoration: none; }
  .a-nav a:not(.pill):hover { color: var(--text); }
  @media (max-width: 420px) { .brand { font-size: 16px; } .a-nav { gap: 12px; font-size: 12px; } .a-nav a[href="/#follow"] { display: none; } }

  /* Article */
  .article { max-width: 760px; padding-top: 36px; padding-bottom: 72px; position: relative; isolation: isolate; }
  .article::before { content: ""; position: absolute; z-index: -1; width: min(700px, 80vw); aspect-ratio: 1; right: -10%; top: -200px; background: radial-gradient(circle, rgba(0,229,255,.12), transparent 62%); pointer-events: none; }
  .a-head { display: flex; flex-direction: column; gap: 18px; padding-bottom: 32px; margin-bottom: 36px; border-bottom: 1px solid var(--line); }
  .crumbs { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .crumbs a { color: var(--soft); text-decoration: none; }
  .crumbs a:hover { color: var(--cyan); }
  .a-head h1 { margin: 0; font-weight: 900; text-transform: uppercase; font-size: clamp(30px, 5vw, 52px); line-height: 1.04; letter-spacing: -.3px; text-wrap: balance; }
  .a-desc { font-size: 19px; color: var(--soft); }
  .byline { display: flex; gap: 14px; align-items: center; }
  .byline img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 0 2px var(--cyan); }
  .byline p { display: flex; flex-direction: column; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .byline strong { color: var(--text); font-size: 15px; }

  .prose { color: var(--soft); font-size: 18px; }
  .prose > * + * { margin-top: 1.1em; }
  .prose h2 { margin-top: 2.2em; color: var(--text); font-weight: 800; text-transform: uppercase; font-size: clamp(22px, 3vw, 30px); line-height: 1.12; letter-spacing: -.2px; scroll-margin-top: 20px; }
  .prose h2::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--cyan); margin-bottom: 14px; }
  .prose h3 { margin-top: 1.8em; color: var(--text); font-weight: 800; font-size: 20px; }
  .prose strong { color: var(--text); }
  .prose a { color: var(--text); text-decoration-color: var(--cyan); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .prose a:hover { color: var(--cyan); }
  .prose ul, .prose ol { padding-left: 1.3em; }
  .prose li + li { margin-top: .45em; }
  .prose li::marker { color: var(--cyan); font-weight: 700; }
  .prose blockquote { margin: 1.3em 0 0; padding: 16px 20px; background: var(--card); border-left: 4px solid var(--cyan); border-radius: 0 12px 12px 0; color: var(--text); }
  .prose code { font-size: .88em; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 6px; color: var(--cyan); }
  /* FAQ: question paragraphs that are a lone bold line */
  .prose h2#faq ~ p:has(> strong:only-child) { margin-top: 1.8em; color: var(--text); font-weight: 800; font-size: 19px; }
  .prose h2#faq ~ p:has(> strong:only-child) + p { margin-top: .4em; }

  /* CTA + more guides */
  .guide-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin: 0 auto; border-radius: 22px; padding: clamp(24px, 5vw, 48px); background: var(--band); box-shadow: inset 0 0 0 2px var(--cyan); }
  .guide-card::before { content: ""; position: absolute; width: 520px; height: 520px; right: -200px; top: -260px; background: radial-gradient(circle, rgba(0,229,255,.2), transparent 62%); pointer-events: none; }
  .guide-card > * { position: relative; }
  .guide-card h2 { margin: 0; font-weight: 900; text-transform: uppercase; font-size: clamp(30px, 5vw, 52px); line-height: 1; }
  .guide-card .body { color: var(--soft); max-width: 54ch; }
  .more-guides { padding-top: 88px; padding-bottom: 96px; }
  .more-guides h2 { margin: 0 0 28px; font-weight: 800; text-transform: uppercase; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.05; }
  .g-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .g-card { display: flex; flex-direction: column; gap: 8px; padding: 24px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); text-decoration: none; transition: box-shadow 300ms, transform 400ms var(--ease); }
  .g-card:hover { color: var(--text); box-shadow: inset 0 0 0 2px var(--cyan); transform: translateY(-3px); }
  .g-kind { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
  .g-title { font-weight: 800; font-size: 20px; line-height: 1.2; text-transform: uppercase; }
  .g-desc { color: var(--soft); font-size: 15px; line-height: 1.5; flex: 1; }
  .g-go { color: var(--cyan); font-weight: 700; font-size: 13px; letter-spacing: .8px; text-transform: uppercase; }

  .foot { border-top: 1px solid var(--line); }
  .foot .wrap { padding-top: 36px; padding-bottom: 52px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; font-size: 15px; color: var(--muted); }
  .foot nav { display: flex; flex-wrap: wrap; gap: 12px 20px; }
  .foot nav a { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line2); }
  .foot nav a:hover { color: var(--cyan); border-color: var(--cyan); }
</style>
